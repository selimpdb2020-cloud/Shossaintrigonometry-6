<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#FFF9EF" />
<title>শিক্ষার্থী — ত্রিকোণমিতি লার্নিং</title>
<link id="favicon-link" rel="icon" type="image/jpeg" href="" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#FFF9EF; --ink:#26241F; --muted:#8B8676; --soft:#F4EEE0; --card:#FFFFFF; --line:#EDE6D4;
    --orange:#FF7A59; --orange-soft:#FFE7DE;
    --blue:#4C6EF5; --blue-soft:#E3E8FD;
    --yellow:#F2B441; --yellow-soft:#FCEFD6;
    --green:#2FA86B; --green-soft:#DFF3E9;
    --red:#E5484D; --red-soft:#FCEAEA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#EDE6D6;
    font-family:'Hind Siliguri',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  button, input{ font-family:inherit; }
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  #view{
    flex:1;
    padding-bottom:86px;
    min-height:100vh;
  }
  a{ color:inherit; }
  .row{ display:flex; align-items:center; }
  .between{ justify-content:space-between; }
  .center{ justify-content:center; align-items:center; }
  .col{ display:flex; flex-direction:column; }
  .muted{ color:var(--muted); }
  .bold{ font-weight:700; }
  .xbold{ font-weight:800; }
  .btn{
    border:none; border-radius:16px; cursor:pointer;
    font-family:inherit; font-weight:800; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--orange); color:#fff; padding:15px; width:100%; }
  .btn-primary[disabled]{ background:var(--soft); color:#C4BDAA; cursor:not-allowed; }
  .btn-dark{ background:var(--ink); color:#fff; padding:13px; width:100%; }
  .btn-dark[disabled]{ background:var(--line); color:var(--muted); cursor:default; }
  .icon-btn{
    width:34px; height:34px; border-radius:11px; border:none; background:var(--soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0;
  }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .pill{ border-radius:999px; padding:4px 10px; font-size:12px; font-weight:800; display:inline-flex; align-items:center; gap:4px; }
  .field-label{ font-size:12px; color:var(--muted); font-weight:700; margin-bottom:6px; }
  .field-input{
    width:100%; border:none; outline:none; background:var(--soft); border-radius:10px;
    padding:11px 13px; font-size:14px; color:var(--ink); font-family:inherit;
  }
  .topbar{ padding:16px 20px 8px; }
  .brandmark{
    width:40px; height:36px; border-radius:10px; background:var(--orange);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-weight:800; font-size:13px;
    overflow:hidden;
  }
  .hairline{ height:1px; background:var(--line); border:none; margin:0; }
  ::selection{ background:var(--orange-soft); }
  input:focus{ outline:2px solid var(--orange); outline-offset:1px; }
  button:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; }

  /* bottom nav */
  #bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:#FFFDF7; border-top:1px solid var(--line);
    display:flex; padding:10px 6px calc(14px + env(safe-area-inset-bottom));
    z-index:40;
  }
  #bottomnav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; color:#B4AE9E; padding:4px 0;
  }
  #bottomnav button.active{ color:var(--orange); }
  #bottomnav button.active svg{ stroke-width:2.6; }
  #bottomnav .navlabel{ font-size:10.5px; font-weight:600; }
  #bottomnav button.active .navlabel{ font-weight:800; }

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px;
    font-size:13px; font-weight:700; z-index:100; box-shadow:0 10px 30px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .spin{ animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>
<div id="shell">
  <div id="view"></div>
  <div id="bottomnav" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>

/* ---------- storage helpers ----------
   শেয়ার্ড ডেটা (topics/notes/students) -> Supabase টেবিল 'lms_kv' (key/value, jsonb)
   লোকাল ডেটা (এই ডিভাইসের সেশন) -> ব্রাউজার localStorage
------------------------------------------------------------- */
let _configWarned = false;
function warnIfNotConfigured(){
  if (!supabaseClient && !_configWarned){
    _configWarned = true;
    console.error('Supabase কনফিগার করা হয়নি — কোডের উপরের দিকে SUPABASE_URL ও SUPABASE_ANON_KEY পূরণ করুন।');
    toast('Supabase কনফিগার করা হয়নি — সেটআপ নির্দেশিকা দেখুন');
  }
}

async function loadShared(key, fallback){
  if (!supabaseClient){ warnIfNotConfigured(); return fallback; }
  try{
    const { data, error } = await supabaseClient
      .from('lms_kv')
      .select('value')
      .eq('key', key)
      .maybeSingle();
    if (error || !data) return fallback;
    return data.value;
  }catch(e){ console.error('loadShared failed', key, e); return fallback; }
}
async function saveShared(key, value){
  if (!supabaseClient){ warnIfNotConfigured(); return; }
  try{
    const { error } = await supabaseClient
      .from('lms_kv')
      .upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error) console.error('saveShared failed', key, error);
  }catch(e){ console.error('saveShared failed', key, e); }
}
async function loadLocal(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
async function saveLocal(key, value){
  try{
    if (value === null || value === undefined) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(value));
  }catch(e){ console.error('saveLocal failed', key, e); }
}

function todayLabel(){
  const d = new Date();
  const months = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  const bn = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  const num = String(d.getDate()).split('').map(c=>bn[+c]).join('');
  return `${num} ${months[d.getMonth()]}`;
}

function toast(msg){

  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2200);

function normPhone(p){ return (p||'').replace(/\D/g,''); }

/* ---------- boot ---------- */
async function boot(){
  const [topics, notes, bq, idx, savedPhone, savedToken] = await Promise.all([
    loadShared('lms:topics', null),
    loadShared('lms:notes', null),
    loadShared('lms:boardquestions', null),
    loadShared('lms:students:index', []),
    loadLocal('lms:session:phone', null),
    loadLocal('lms:session:token', null),
  ]);
  S.topics = topics || DEFAULT_TOPICS;
  S.notes = notes || DEFAULT_NOTES;
  S.boardQuestions = bq || DEFAULT_BOARD_QUESTIONS;
  S.studentsIndex = idx || [];
  if (!topics) await saveShared('lms:topics', S.topics);
  if (!notes) await saveShared('lms:notes', S.notes);
  if (!bq) await saveShared('lms:boardquestions', S.boardQuestions);

  if (savedPhone){
    const rec = await loadShared('lms:student:'+savedPhone, null);
    if (rec && rec.activeSessionToken && savedToken && rec.activeSessionToken !== savedToken){
      // another device logged in more recently — this session is no longer valid
      await saveLocal('lms:session:phone', null);
      await saveLocal('lms:session:token', null);
      S.sessionKickedOut = true;
      S.pendingScreen = 'student-login';
    } else if (rec){
      if (!rec.activeSessionToken){
        // legacy account without a token yet — bind this device now
        rec.activeSessionToken = savedToken || generateSessionToken();
        await saveShared('lms:student:'+savedPhone, rec);
        await saveLocal('lms:session:token', rec.activeSessionToken);
      }
      S.currentPhone = savedPhone;
      S.currentStudent = rec;
      S.role = 'student';
      S.pendingScreen = 'app';
      S.activeTopicId = S.topics[0] ? S.topics[0].id : null;
      startSessionWatcher();
    }
  }
  if (!S.currentStudent){ S.pendingScreen = 'student-login'; }

  const urlParams = new URLSearchParams(window.location.search);
  const paymentStatus = urlParams.get('payment');
  if (paymentStatus === 'success' || paymentStatus === 'fail' || paymentStatus === 'cancel'){
    S.paymentResult = paymentStatus;
    S.screen = 'payment-result';
    history.replaceState(null, '', window.location.pathname);
  }

  S.loaded = true;
  render();
}

/* ---------- student data ops ---------- */
async function registerOrLoadStudent(phone, name, cls, school, guardianPhone, address, password){
  const key = 'lms:student:'+phone;
  let rec = await loadShared(key, null);
  if (!rec){
    rec = { phone, name: name||'', cls: cls||'নবম-দশম', school: school||'', guardianPhone: guardianPhone||'', address: address||'', password: password||'', joined: todayLabel(), paid:false, paymentMethod:null, completed:[] };
    await saveShared(key, rec);
    if (!S.studentsIndex.includes(phone)){
      S.studentsIndex.push(phone);
      await saveShared('lms:students:index', S.studentsIndex);
    }
  }
  return rec;
}
async function saveCurrentStudent(){
  if (!S.currentStudent) return;
  await saveShared('lms:student:'+S.currentStudent.phone, S.currentStudent);
}

/* ---------- single-device session enforcement ---------- */
function generateSessionToken(){
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}
let sessionWatcherId = null;
function startSessionWatcher(){
  if (sessionWatcherId) clearInterval(sessionWatcherId);
  sessionWatcherId = setInterval(checkSessionValidity, 20000);
  document.addEventListener('visibilitychange', onVisibilityCheckSession);
}
function stopSessionWatcher(){
  if (sessionWatcherId){ clearInterval(sessionWatcherId); sessionWatcherId = null; }
  document.removeEventListener('visibilitychange', onVisibilityCheckSession);
}
function onVisibilityCheckSession(){
  if (document.visibilityState === 'visible') checkSessionValidity();
}
async function checkSessionValidity(){
  if (!S.currentPhone) return;
  const localToken = await loadLocal('lms:session:token', null);
  if (!localToken) return;
  const rec = await loadShared('lms:student:'+S.currentPhone, null);
  if (rec && rec.activeSessionToken && rec.activeSessionToken !== localToken){
    stopSessionWatcher();
    await saveLocal('lms:session:phone', null);
    await saveLocal('lms:session:token', null);
    S.role = null; S.currentStudent = null; S.currentPhone = null;
    S.screen = 'student-login'; S.studentTab='home'; S.homeView='dashboard';
    S.sessionKickedOut = true;
    render();
  }
}

/* ---------- derived helpers ---------- */
function visibleTopics(){
  return S.topics.map(t=>({...t, lessons: t.lessons.filter(l=>l.published!==false)}));
}
function visibleNotes(){ return S.notes.filter(n=>n.published!==false); }
function visibleBoardQuestions(){ return S.boardQuestions.filter(q=>q.published!==false); }
function getTopic(id){ return S.topics.find(t=>t.id===id); }
function totalPublishedLessons(){ return visibleTopics().reduce((a,t)=>a+t.lessons.length,0); }
function totalDoneCount(){
  if (!S.currentStudent) return 0;
  const validIds = new Set(visibleTopics().flatMap(t=>t.lessons.map(l=>t.id+'::'+l.id)));
  return (S.currentStudent.completed||[]).filter(k=>validIds.has(k)).length;
}
function isLessonDone(topicId, lessonId){
  return !!(S.currentStudent && (S.currentStudent.completed||[]).includes(topicId+'::'+lessonId));
}
function ytEmbed(url){
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}
function isDirectVideo(url){
  if (!url) return false;
  return /\.(mp4|webm|ogg|mov|m4v)(\?|$)/i.test(url) || url.includes('/storage/v1/object/public/');
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const view = document.getElementById('view');
  const nav = document.getElementById('bottomnav');

  if (!S.loaded){
    view.innerHTML = renderLoading();
    nav.style.display = 'none';
    return;
  }

  if (S.screen === 'payment-result'){
    view.innerHTML = renderPaymentResult();
    nav.style.display = 'none';
    wirePaymentResult();
    return;
  }

  if (S.screen === 'splash'){
    view.innerHTML = renderSplash();
    nav.style.display = 'none';
    wireSplash();
    return;
  }

  if (S.screen === 'student-login'){
    nav.style.display = 'none';
    renderStudentLogin();
    return;
  }

  if (S.screen === 'student-register'){
    nav.style.display = 'none';
    renderStudentRegister();
    return;
  }

  if (S.screen === 'landing'){
    view.innerHTML = renderLanding();
    nav.style.display = 'none';
    wireLanding();
    return;
  }

  if (S.role === 'student'){
    nav.style.display = S.screen === 'lesson' ? 'none' : 'flex';
    if (S.screen === 'lesson'){
      view.innerHTML = renderLesson();
      wireLesson();
    } else {
      view.innerHTML = renderStudentScreen();
      wireStudentScreen();
      nav.innerHTML = renderStudentNav();
      wireStudentNav();
    }
    return;
  }

  if (S.role === 'admin'){
    if (!S.adminAuthed){
      view.innerHTML = renderAdminLogin();
      nav.style.display = 'none';
      wireAdminLogin();
      return;
    }
    nav.style.display = 'flex';
    view.innerHTML = renderAdminScreen();
    wireAdminScreen();
    nav.innerHTML = renderAdminNav();
    wireAdminNav();
    return;
  }
}

    loginBtn.innerHTML = `<span class="spin" style="display:inline-flex;">${icon('flame',16)}</span> লোড হচ্ছে…`;
    const rec = await loadShared('lms:student:'+p, null);
    if (!rec){
      loginBtn.disabled = false;
      loginBtn.innerHTML = `লগইন করুন ${icon('arrowright',18)}`;
      errorEl.textContent = 'এই নম্বরে কোনো অ্যাকাউন্ট নেই — ভর্তির জন্য প্রতিষ্ঠানের সাথে যোগাযোগ করুন';
      return;
    }
    if (!rec.password){
      // legacy account without a password yet — set this as their password
      rec.password = pass;
      await saveShared('lms:student:'+p, rec);
    } else if (rec.password !== pass){
      loginBtn.disabled = false;
      loginBtn.innerHTML = `লগইন করুন ${icon('arrowright',18)}`;
      errorEl.textContent = 'পাসওয়ার্ড সঠিক নয়';
      return;
    }
    const newToken = generateSessionToken();
    rec.activeSessionToken = newToken;
    await saveShared('lms:student:'+p, rec);
    S.currentPhone = p;
    S.currentStudent = rec;
    S.role = 'student';
    S.screen = 'app';
    S.activeTopicId = S.topics[0] ? S.topics[0].id : null;
    await saveLocal('lms:session:phone', p);
    await saveLocal('lms:session:token', newToken);
    startSessionWatcher();
    render();
  }
  loginBtn.onclick = doLogin;
  passInput.addEventListener('keydown', e=>{ if (e.key==='Enter') doLogin(); });
}

const BOARD_ICON_STYLES = [
  { bg:'var(--blue-soft)',   fg:'var(--blue)' },
  { bg:'var(--green-soft)',  fg:'var(--green)' },
  { bg:'var(--orange-soft)', fg:'var(--orange)' },
  { bg:'#EFE6FD',            fg:'#8B5CF6' },
  { bg:'#DDF3F6',            fg:'#22A6B3' },
  { bg:'var(--yellow-soft)', fg:'#B8860B' },
  { bg:'var(--red-soft)',    fg:'var(--red)' },
  { bg:'#FCE4EF',            fg:'#EB6FA0' },
  { bg:'#E7F0DE',            fg:'#5C8A4A' },
];
function boardStyleFor(boardName, allBoards){
  const idx = allBoards.indexOf(boardName);
  return BOARD_ICON_STYLES[idx % BOARD_ICON_STYLES.length];
}

function renderBoardQuestions(){
  const qs = visibleBoardQuestions();
  const boards = [...new Set(qs.map(q=>q.board))];
  if (S.activeBoardName && !boards.includes(S.activeBoardName)) S.activeBoardName = null;

  if (S.activeBoardName){
    const boardName = S.activeBoardName;
    const items = qs.filter(q=>q.board===boardName).sort((a,b)=>b.year.localeCompare(a.year));
    const st = boardStyleFor(boardName, boards);
    return `
    <div style="padding-top:24px;">
      <div class="topbar row" style="gap:10px;">
        <button class="icon-btn" id="back-board-detail">${icon('chevronleft',18)}</button>
        <div>
          <div class="muted" style="font-size:13px;font-weight:600;">বিগত বছরের প্রশ্নপত্র</div>
          <div style="font-size:20px;font-weight:800;">${boardName}</div>
        </div>
      </div>
      <div class="col" style="padding:14px 20px 24px;gap:12px;">
        ${items.length===0 ? `<div class="muted" style="padding:12px 2px;">এখনো কোনো প্রশ্নপত্র প্রকাশিত হয়নি</div>` :
        items.map((q,i)=>{
          const label = `${boardName} - ${q.year}`;
          return `
          <a href="${q.url}" target="_blank" rel="noopener noreferrer" class="card row" style="padding:14px 16px;gap:14px;text-decoration:none;color:inherit;">
            <div style="width:46px;height:46px;border-radius:14px;background:${st.bg};display:flex;align-items:center;justify-content:center;color:${st.fg};flex-shrink:0;">${icon('file',21)}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:16px;font-weight:800;">${label}</div>
            </div>
            <span class="icon-btn" style="width:40px;height:40px;border-radius:50%;background:${st.bg};color:${st.fg};">${icon('eye',18)}</span>
          </a>`;
        }).join('')}
      </div>
    </div>`;
  }

  return `
  <div style="padding-top:24px;">
    <div class="topbar row" style="gap:10px;">
      <button class="icon-btn" id="back-board">${icon('chevronleft',18)}</button>
      <div>
        <div class="muted" style="font-size:13px;font-weight:600;">বিগত বছরের প্রশ্নপত্র</div>
        <div style="font-size:20px;font-weight:800;">এসএসসি বোর্ড প্রশ্ন</div>

function resizeImageToDataUrl(file, size){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('image decode failed'));
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}


/* ---------- payment sheet (demo) ---------- */
function openPaymentSheet(){
  // Redirects the student to a real SSLCommerz-hosted checkout page
  // (bKash, Nagad, Rocket, cards — all handled by the gateway itself).
  // After payment, SSLCommerz calls our Supabase Edge Function which validates
  // the transaction and marks the student paid, then sends the browser back
  // to student-app.html?payment=success — handled by renderPaymentResult().
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(38,36,31,0.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;';
  overlay.innerHTML = `

        <div>
          <div style="font-size:11.5px;color:#C9C4B4;font-weight:600;">কোর্স মূল্য</div>
          <div style="font-size:22px;font-weight:800;">৳${COURSE_FEE}</div>
        </div>
        <span style="color:#3FA796;">${icon('shield',20)}</span>
      </div>

        বিকাশ, নগদ, রকেট বা কার্ড — SSLCommerz-এর নিরাপদ পেমেন্ট পেজে গিয়ে আপনার পছন্দমতো পদ্ধতি বেছে নিতে পারবেন।
      </div>
      <div id="pay-error" class="muted" style="font-size:12px;color:var(--red);font-weight:700;min-height:16px;margin-bottom:6px;"></div>
      <button class="btn btn-primary" id="go-gateway-btn">পেমেন্ট পেজে যান ${icon('arrowright',18)}</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#close-pay').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if (e.target===overlay) overlay.remove(); };

  overlay.querySelector('#go-gateway-btn').onclick = async ()=>{
    const btn = overlay.querySelector('#go-gateway-btn');
    const errorEl = document.getElementById('pay-error');
    errorEl.textContent = '';
    btn.disabled = true;
    btn.innerHTML = `<span class="spin" style="display:inline-flex;">${icon('flame',16)}</span> সংযোগ হচ্ছে…`;
    try{
      const res = await fetch(SSL_FUNCTIONS_BASE + '/ssl-init', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({
          phone: S.currentStudent.phone,
          name: S.currentStudent.name,
          amount: COURSE_FEE,
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.url){
        throw new Error(data.error || 'গেটওয়ে চালু করা যায়নি');
      }
      window.location.href = data.url;
    }catch(e){
      btn.disabled = false;
      btn.innerHTML = `পেমেন্ট পেজে যান ${icon('arrowright',18)}`;
      errorEl.textContent = 'সংযোগে সমস্যা হয়েছে — আবার চেষ্টা করুন';

/* --- video classes admin --- */
let adminVideoState = { activeTopic:'ratio', formMode:null, confirmDelete:null };
function paintVideoAdmin(body){
  const topics = S.topics;
  const topic = topics.find(t=>t.id===adminVideoState.activeTopic) || topics[0];
  if (!topic){ body.innerHTML = `<div class="muted">কোনো টপিক নেই</div>`; return; }
  body.innerHTML = `
    <div class="row between" style="margin-bottom:14px;">
      <div style="font-size:15px;font-weight:800;">ভিডিও ক্লাস তালিকা</div>
      <button class="btn" id="add-lesson-btn" style="background:var(--orange);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;">${icon('plus',15)} যোগ করুন</button>
    </div>
    <div class="row" style="gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;">
      ${topics.map(t=>`<div data-topic="${t.id}" class="row" style="gap:6px;padding:8px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;background:${t.id===topic.id?t.color:'var(--soft)'};color:${t.id===topic.id?'#fff':'var(--ink)'};font-size:13px;font-weight:700;flex-shrink:0;">
        <span style="width:7px;height:7px;border-radius:4px;background:${t.id===topic.id?'#fff':t.color};"></span>${t.name}</div>`).join('')}
    </div>
    <div id="lesson-form"></div>
    <div class="muted" style="font-size:13px;font-weight:600;margin-bottom:10px;">${topic.lessons.length}টি ভিডিও ক্লাস</div>
    <div class="col" style="gap:12px;">
      ${topic.lessons.length===0? `<div class="muted" style="text-align:center;padding:24px;">কোনো ভিডিও ক্লাস নেই</div>` :
      topic.lessons.map(l=>`
        <div class="card" style="overflow:hidden;">
          <div style="position:relative;height:80px;background:linear-gradient(135deg, ${topic.color}, ${topic.color}99);display:flex;align-items:center;justify-content:center;">
            <div style="width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;color:${topic.color};">${icon('play',18)}</div>
            <div style="position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,0.55);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;">${l.duration}</div>
            <div style="position:absolute;top:8px;right:10px;display:flex;gap:6px;">
              <button data-edit="${l.id}" class="icon-btn" style="width:26px;height:26px;background:rgba(255,255,255,0.9);">${icon('pencil',12)}</button>
              <button data-del="${l.id}" class="icon-btn" style="width:26px;height:26px;background:rgba(255,255,255,0.9);color:var(--red);">${icon('trash',12)}</button>
            </div>
          </div>
          ${adminVideoState.confirmDelete===l.id ? `
          <div class="row between" style="padding:12px;background:var(--red-soft);">
            <span style="font-size:13px;font-weight:700;color:var(--red);">এই ক্লাসটি মুছে ফেলবেন?</span>
            <div class="row" style="gap:8px;">
              <div data-cancel-del style="font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 10px;">বাতিল</div>
              <div data-confirm-del="${l.id}" style="font-size:12px;font-weight:700;color:#fff;background:var(--red);cursor:pointer;padding:6px 12px;border-radius:999px;">মুছে ফেলুন</div>
            </div>
          </div>` : `
          <div class="row" style="padding:12px;gap:10px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:14px;font-weight:700;">${l.title}</div>
              <div class="muted" style="font-size:12px;margin-top:2px;">${l.views||0} বার দেখা হয়েছে</div>
            </div>
            <div data-pub="${l.id}" class="row" style="gap:5px;cursor:pointer;padding:6px 10px;border-radius:999px;background:${l.published?'var(--green-soft)':'var(--soft)'};flex-shrink:0;">
              ${icon(l.published?'eye':'eyeoff',13)}
              <span style="font-size:11px;font-weight:700;color:${l.published?'var(--green)':'var(--muted)'};">${l.published?'প্রকাশিত':'খসড়া'}</span>
            </div>
          </div>`}
        </div>`).join('')}
    </div>`;

  body.querySelectorAll('[data-topic]').forEach(el=>{
    el.onclick = ()=>{ adminVideoState.activeTopic = el.dataset.topic; adminVideoState.formMode=null; paintVideoAdmin(body); };
  });
  body.querySelector('#add-lesson-btn').onclick = ()=>{ adminVideoState.formMode='add'; paintVideoAdmin(body); paintLessonForm(topic); };
  body.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = ()=>{ adminVideoState.formMode = el.dataset.edit; paintVideoAdmin(body); paintLessonForm(topic); };
  });
  body.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{ adminVideoState.confirmDelete = el.dataset.del; paintVideoAdmin(body); };
  });
  const cancelDel = body.querySelector('[data-cancel-del]');
  if (cancelDel) cancelDel.onclick = ()=>{ adminVideoState.confirmDelete=null; paintVideoAdmin(body); };
  const confirmDel = body.querySelector('[data-confirm-del]');
  if (confirmDel) confirmDel.onclick = async ()=>{
    const id = confirmDel.dataset.confirmDel;
    topic.lessons = topic.lessons.filter(l=>l.id!==id);
    await saveShared('lms:topics', S.topics);
    adminVideoState.confirmDelete = null;
    toast('ক্লাসটি মুছে ফেলা হয়েছে');
    paintVideoAdmin(body);
  };
  if (adminVideoState.formMode) paintLessonForm(topic);

  function paintLessonForm(topic){
    const formEl = body.querySelector('#lesson-form');
    const isAdd = adminVideoState.formMode === 'add';
    const existing = isAdd ? null : topic.lessons.find(l=>l.id===adminVideoState.formMode);
    formEl.innerHTML = `
      <div class="card" style="padding:16px;margin-bottom:16px;">
        <div class="row between" style="margin-bottom:12px;">
          <span style="font-size:14px;font-weight:800;">${isAdd?'নতুন ভিডিও ক্লাস':'ক্লাস সম্পাদনা করুন'}</span>

        </div>
        <div class="field-label">শিরোনাম</div>
        <input id="lf-title" class="field-input" value="${existing?existing.title:''}" placeholder="ক্লাসের নাম লিখুন" style="margin-bottom:10px;" />
        <div class="field-label">সময়কাল</div>
        <input id="lf-duration" class="field-input" value="${existing?existing.duration:''}" placeholder="যেমন: ১৫ মিনিট" style="margin-bottom:10px;" />
        <div class="field-label">ভিডিও লিংক (YouTube)</div>
        <input id="lf-video" class="field-input" value="${existing?existing.videoUrl||'':''}" placeholder="https://youtube.com/watch?v=..." style="margin-bottom:10px;" />
        <div id="lf-preview"></div>
        <button class="btn btn-dark" id="lf-save" style="margin-top:4px;">${icon('check',15)} সংরক্ষণ করুন</button>
      </div>`;

          <div style="flex:1;"><div class="field-label">পৃষ্ঠা সংখ্যা</div><input id="nf-pages" class="field-input" value="${existing?existing.pages:''}" placeholder="৬" /></div>

            </div>
            <div style="border-radius:12px;overflow:hidden;border:1px solid var(--line);height:260px;background:var(--soft);">

            </div>
            <div class="muted" style="font-size:10.5px;margin-top:4px;">যদি প্রিভিউ ফাঁকা দেখায়, লিংক সঠিক আছে কিনা "নতুন ট্যাবে খুলুন" চেপে যাচাই করুন</div>
          </div>`;

/* --- board questions admin --- */
let adminBoardState = { activeBoard:null, formMode:null, confirmDelete:null };
function paintBoardAdmin(body){
  const qs = S.boardQuestions;
  const boards = [...new Set(qs.map(q=>q.board))];
  if (adminBoardState.activeBoard && !boards.includes(adminBoardState.activeBoard)){
    adminBoardState.activeBoard = null;
  }

  if (adminBoardState.activeBoard){
    paintBoardYearsAdmin(body, adminBoardState.activeBoard);
    return;
  }
  paintBoardListAdmin(body);
}

  const qs = S.boardQuestions;
  const boards = [...new Set(qs.map(q=>q.board))];
  body.innerHTML = `

      ${boards.length===0? `<div class="muted" style="text-align:center;padding:24px;">কোনো বোর্ড নেই</div>` :
      boards.map(b=>{

            <div style="font-size:14px;font-weight:700;">${b}</div>
            <div class="muted" style="font-size:12px;margin-top:2px;">${count}টি সাল · ${published}টি প্রকাশিত</div>
          </div>
          <span style="color:var(--muted);">${icon('chevronright',18)}</span>
        </div>`;
      }).join('')}
    </div>`;

  body.querySelectorAll('.board-nav-row').forEach(el=>{
    el.onclick = ()=>{ adminBoardState.activeBoard = el.dataset.board; adminBoardState.formMode=null; render(); };
  });
  body.querySelector('#add-board-btn').onclick = ()=>{ adminBoardState.formMode='newboard'; paintNewBoardForm(body); };

    const formEl = document.getElementById('new-board-form');
    formEl.innerHTML = `
      <div class="card" style="padding:16px;margin-bottom:16px;">
        <div class="row between" style="margin-bottom:12px;">
          <span style="font-size:14px;font-weight:800;">নতুন বোর্ড ও প্রশ্নপত্র</span>
          <button class="icon-btn" id="close-newboard">${icon('x',15)}</button>
        </div>
        <div class="field-label">বোর্ডের নাম</div>
        <input id="nb-board" class="field-input" placeholder="যেমন: খুলনা বোর্ড" style="margin-bottom:10px;" />
        <div class="row" style="gap:10px;margin-bottom:10px;">
          <div style="flex:1;"><div class="field-label">সাল</div><input id="nb-year" class="field-input" placeholder="২০২৬" /></div>
        </div>
        <div class="field-label">শিরোনাম</div>
        <input id="nb-title" class="field-input" value="এসএসসি — গণিত (ত্রিকোণমিতি অংশ)" style="margin-bottom:10px;" />

        <input id="nb-url" class="field-input" placeholder="https://example.com/question.pdf" style="margin-bottom:10px;" />
        <button class="btn btn-dark" id="nb-save">${icon('check',15)} সংরক্ষণ করুন</button>
      </div>`;
    formEl.querySelector('#close-newboard').onclick = ()=>{ adminBoardState.formMode=null; paintBoardListAdmin(body); };
    formEl.querySelector('#nb-save').onclick = async ()=>{
      const board = document.getElementById('nb-board').value.trim();
      const year = document.getElementById('nb-year').value.trim();
      const title = document.getElementById('nb-title').value.trim() || 'এসএসসি — গণিত (ত্রিকোণমিতি অংশ)';

      toast('সংরক্ষণ করা হয়েছে ✓');
      render();
    };
  }
}

        <div class="field-label">পিডিএফ লিংক</div>
        <input id="bq-url" class="field-input" value="${existing?existing.url||'':''}" placeholder="https://example.com/question.pdf" style="margin-bottom:10px;" />
        <div id="bq-preview"></div>
        <button class="btn btn-dark" id="bq-save" style="margin-top:4px;">${icon('check',15)} সংরক্ষণ করুন</button>
      </div>`;
    formEl.querySelector('#close-bqform').onclick = ()=>{ adminBoardState.formMode=null; paintBoardYearsAdmin(body, boardName); };

    function paintPdfPreview(){
      const url = document.getElementById('bq-url').value.trim();
      const previewEl = document.getElementById('bq-preview');
      if (!url){
        previewEl.innerHTML = '';
      } else {
        previewEl.innerHTML = `
          <div style="margin-bottom:14px;">
            <div class="row between" style="margin-bottom:6px;">
              <span class="muted" style="font-size:11.5px;font-weight:700;">${icon('eye',12)} প্রিভিউ</span>
              <a href="${url}" target="_blank" rel="noopener noreferrer" class="muted" style="font-size:11px;font-weight:700;color:var(--blue);text-decoration:none;">নতুন ট্যাবে খুলুন ↗</a>
            </div>
            <div style="border-radius:12px;overflow:hidden;border:1px solid var(--line);height:260px;background:var(--soft);">
              <iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>
            </div>
          </div>`;
      }
    }
    document.getElementById('bq-url').addEventListener('input', paintPdfPreview);
    paintPdfPreview();

    formEl.querySelector('#bq-save').onclick = async ()=>{
      const year = document.getElementById('bq-year').value.trim();
      const title = document.getElementById('bq-title').value.trim() || 'এসএসসি — গণিত (ত্রিকোণমিতি অংশ)';
      const url = document.getElementById('bq-url').value.trim();
      if (!year) return;
      if (isAdd){
        S.boardQuestions.push({ id:'bq-'+Date.now(), year, board:boardName, title, url, published:false });
      } else {
        Object.assign(existing, { year, title, url });
      }
      await saveShared('lms:boardquestions', S.boardQuestions);
      adminBoardState.formMode = null;
      toast('সংরক্ষণ করা হয়েছে ✓');
      paintBoardYearsAdmin(body, boardName);
    };
  }
}

/* ---------- go ---------- */
boot();
</script>
</body>
</html>
